<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <!-- import font -->
    <link href="https://fonts.googleapis.com/css?family=Noto+Serif:700|Roboto+Mono" rel="stylesheet">
    <!-- import Vuetify -->
    <link href="https://cdn.jsdelivr.net/npm/@mdi/font@5.x/css/materialdesignicons.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/vuetify@3.12.6/dist/vuetify.min.css" rel="stylesheet">
    <!-- import Vue3 & Vuetify3 from CDN -->
    <script type="importmap"> { "imports": {
            "vue": "https://unpkg.com/vue@3/dist/vue.esm-browser.js", 
            "vuetify": "https://cdn.jsdelivr.net/npm/vuetify@3.12.6/dist/vuetify.esm.js"
        } } </script>
    <!-- import sprintf-js from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/sprintf-js@1.1.3/dist/sprintf.min.js"></script>
    <!-- import Vue3 JS code -->
    <script type="module" src="samxam2.js"></script>
    <!-- load other JS files -->
    <!-- custom style -->
    <!-- Page Title -->
    <title>SAMXAM</title>
</head>

<body id="app">
    <v-app>
        <v-main class="bg-grey-lighten-4">
            <v-container class="py-4 ml-0" style="overflow-x: auto;">
                <v-row justify="start">
                    <v-col cols="auto">
                        <v-card class="elevation-4" style="width: 820px; min-width: 820px;">
                            <!-- Title -->
                            <v-toolbar id="TITLE" color="primary" height="80" class="position-relative">
                                <v-toolbar-title class="text-center font-weight-bold">
                                    <div class="text-h4" style="cursor: default; font-family: 'Noto Serif';">S A M X A M
                                        <span class="text-body-1">(β)</span>
                                    </div>
                                    <div class="text-caption font-weight-regular text-grey-lighten-3"
                                        style="cursor: default; font-family: 'Noto Serif';">
                                        - Sample to detector calculator - (GISAXS analysis)
                                    </div>
                                </v-toolbar-title>
                                <v-btn icon="mdi-license" class="position-absolute"
                                    style="right: 16px; top: 50%; transform: translateY(-50%);"
                                    @click="licenseDialog = true"></v-btn>
                            </v-toolbar>
                            <!-- Sample settings -->
                            <v-toolbar id="X-RAY" class="mb-3" color="blue-lighten-2" density="compact">
                                <v-toolbar-title class="text-subtitle-1 font-weight-bold text-white"
                                    style="cursor: default;">
                                    <span>Sample (</span>
                                    <select v-model="sampleType"
                                        class="bg-blue-lighten-2 text-white rounded mx-1 px-2 py-0"
                                        style="outline: none; cursor: pointer; appearance: auto;">
                                        <option :value="TYPE_SAMPLE.FOIL">Foil</option>
                                        <option :value="TYPE_SAMPLE.PELLETE">Pellete</option>
                                    </select>
                                    <span> )</span>
                                </v-toolbar-title>
                            </v-toolbar>
                            <v-card-text class="pa-4">
                                <v-row align="center" class="mb-2" dense="compact">
                                    <v-col cols="4" v-if="sampleType === TYPE_SAMPLE.FOIL"><!-- FOIL -->
                                        <v-number-input v-model="Foil_R" label="Density" suffix=" g/cm³"
                                            density="compact" variant="outlined" control-variant="hidden" precision="2"
                                            hide-details>
                                        </v-number-input>
                                    </v-col>
                                    <v-col cols="2" v-if="sampleType === TYPE_SAMPLE.PELLETE"><!-- PELLETE -->
                                        <v-select v-model="Pellet_Medium" label="Medium" :items="TYPE_MEDIUM_PELLETE"
                                            item-title="Type" item-value="Id" density="compact" variant="outlined"
                                            density="compact" @update:model-value="onSelect_Medium" hide-details>
                                        </v-select>
                                    </v-col>
                                    <v-col cols="3"
                                        v-if="sampleType === TYPE_SAMPLE.PELLETE && Pellet_Medium === 1"><!-- BN -->
                                        <v-select v-model="Pellet_Def" :items="TYPE_DEF_PELLETE" item-title="Type"
                                            item-value="Id" density="compact" variant="outlined" density="compact"
                                            hide-details>
                                        </v-select>
                                    </v-col>
                                    <span
                                        v-if="sampleType === TYPE_SAMPLE.PELLETE && Pellet_Medium === 1">&nbsp;=&nbsp;</span>
                                    <v-col cols="2"
                                        v-if="sampleType === TYPE_SAMPLE.PELLETE && Pellet_Medium === 1"><!-- Thickness -->
                                        <v-number-input v-model="Pellet_T" :suffix="Pellet_Def==0?'mm':'mg'"
                                            density="compact" variant="outlined" control-variant="hidden"
                                            hide-details></v-number-input>
                                    </v-col>
                                    <span
                                        v-if="sampleType === TYPE_SAMPLE.PELLETE && Pellet_Medium === 1 && Pellet_Def === 0">&nbsp;(
                                        {{(3.1416*(Pellet_D/2)*(Pellet_D/2)*Pellet_T*2.20907).toFixed(2)}}
                                        mg )</span>
                                    <v-col cols="3"
                                        v-if="sampleType === TYPE_SAMPLE.PELLETE && Pellet_Medium === 2"><!-- PELLETE Other... -->
                                        <v-number-input v-model="Pellet_T" label="Weight" suffix="mg" density="compact"
                                            variant="outlined" control-variant="hidden" hide-details></v-number-input>
                                    </v-col>
                                </v-row>
                                <v-row align="center" class="mb-2" dense="compact"
                                    v-if="sampleType === TYPE_SAMPLE.PELLETE && Pellet_Medium === 2">
                                    <v-col>
                                        <table border="1" cellspacing="0" style="border:2px solid #333">
                                            <thead>
                                                <tr>
                                                    <th class="text-body-2 text-white font-weight-bold px-4 bg-blue-lighten-3"
                                                        style="width: 160px;">
                                                        Element</th>
                                                    <th class="text-body-2 text-white font-weight-bold px-4 bg-blue-lighten-3"
                                                        style="width: 160px;">
                                                        Atom</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                <template v-for="(Z, i) in Pellet_Medium_Z">
                                                    <tr align="center">
                                                        <td>
                                                            <select v-model="Pellet_Medium_Z[i]"
                                                                @change="onChange_Medium_Z(i)"
                                                                style="width: 60px; cursor: pointer; appearance: auto;">
                                                                <template v-for="E in ElementNamesZ">
                                                                    <option :value="E.Z">{{ E.Name }}</option>
                                                                </template>
                                                            </select>
                                                        </td>
                                                        <td>
                                                            <input type="number" v-model="Pellet_Medium_Ratio[i]"
                                                                step="1" min="1" class="px-2 text-right"
                                                                style="width: 80px; cursor: pointer; appearance: auto;">
                                                        </td>
                                                    </tr>
                                                </template>
                                                <tr align="center"><!-- 最終行 -->
                                                    <td>
                                                        <select v-model="Pellet_Medium_Z_last"
                                                            @change="onChange_Medium_Z_last"
                                                            style="width: 60px; cursor: pointer; appearance: auto;">
                                                            <template v-for="E in ElementNamesZ">
                                                                <option :value="E.Z">{{ E.Name }}</option>
                                                            </template>
                                                        </select>
                                                    </td>
                                                    <td>
                                                        <input type="number" v-model="Pellet_Medium_Ratio_last" step="1"
                                                            min="1" class="px-2 text-right" disabled="true"
                                                            style="width: 80px; cursor: default; appearance: auto;">
                                                    </td>
                                                </tr>
                                            </tbody>
                                        </table>
                                    </v-col>
                                </v-row>
                                {{ Pellet_Medium_Z }} {{ Pellet_Medium_Ratio }}
                            </v-card-text>
                        </v-card>
                    </v-col>
                </v-row>
            </v-container>
        </v-main>

        <!-- License Dialog -->
        <v-dialog v-model="licenseDialog" max-width="650px">
            <v-card>
                <v-card-title class="text-h5 font-weight-bold bg-primary text-white pa-4">
                    Software Licenses
                </v-card-title>
                <v-card-text class="pa-4 bg-grey-lighten-5 text-body-2" style="max-height: 500px; overflow-y: auto;">
                    <div v-html="licenseContent"></div>
                </v-card-text>
                <v-card-actions class="pa-4 bg-grey-lighten-5">
                    <v-spacer></v-spacer>
                    <v-btn color="primary" variant="elevated" @click="licenseDialog = false">Close</v-btn>
                </v-card-actions>
            </v-card>
        </v-dialog>
    </v-app>
</body>

</html>

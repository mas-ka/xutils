<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <!-- import font -->
        <link href="https://fonts.googleapis.com/css?family=Noto+Serif:700|Roboto+Mono" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/@mdi/font@5.x/css/materialdesignicons.min.css" rel="stylesheet">
        <!-- import Plotly.js -->
        <script src="https://cdn.plot.ly/plotly-3.6.0.min.js" charset="utf-8"></script>
        <!-- import UTIF.js from CDN -->
         <script src="https://unpkg.com/utif@3.1.0/UTIF.js"></script>
        <!-- import Vuetify -->
        <link href="https://cdn.jsdelivr.net/npm/@mdi/font@5.x/css/materialdesignicons.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/vuetify@3.11.4/dist/vuetify.min.css" rel="stylesheet">
        <!-- import Vue3 & Vuetify3 from CDN -->
        <script type="importmap"> { "imports": {
            "vue": "https://unpkg.com/vue@3/dist/vue.esm-browser.js", 
            "vuetify": "https://cdn.jsdelivr.net/npm/vuetify@3.11.4/dist/vuetify.esm.js"
            } } </script>
        <!-- import sprintf-js from CDN -->
        <script src="https://cdn.jsdelivr.net/npm/sprintf-js@1.1.3/dist/sprintf.min.js"></script>
        <!-- import Vue3 JS code -->
        <script type="module" src="epiphany.js"></script>
        <!-- load other JS files -->
        <!-- Page Title -->
        <title>Epiphany</title>
    </head>
    <body>
        <div id="app">
            <v-app class="overflow-hidden">
                <v-toolbar class="ml-3 mt-3 pt-3 pb-1" color="primary" style="width: 928px; cursor: default;">
                    <v-toolbar-title class="d-flex justify-center">
                        <table>
                            <tr><td style="text-align:center; font-family: 'Noto Serif', serif; font-size: 32px; cursor: default;">Epiphany</td></tr>
                            <tr><td height="36" style="text-align:center; font-family: 'Noto Serif', serif; font-size: 12px; cursor: default;">- Applying ROI to "Spectrogram" Post-productively -</td></tr>
                        </table>
                    </v-toolbar-title>
                    <v-dialog v-model="license_dialog" max-width="800">
                        <template v-slot:activator="{ props }">
                            <v-btn v-bind="props" icon="mdi-license"></v-btn>
                        </template>
                        <v-card>
                            <v-toolbar density="compact" color="grey-darken-2" style="cursor: default;">
                                <v-btn icon="mdi-license" :readonly="true"></v-btn>
                                <v-toolbar-title text="License"></v-toolbar-title>
                            </v-toolbar>
                            <v-card-text v-html="licenseHTML"></v-card-text>
                            <v-card-actions>
                                <v-spacer></v-spacer>
                                <v-btn
                                    color="surface-variant" 
                                    text="OK"
                                    variant="flat"
                                    @click="license_dialog=false"
                                ></v-btn>
                            </v-card-actions>
                        </v-card>
                    </v-dialog>
                    <!-- <v-btn icon="mdi-license"></v-btn> -->
                </v-toolbar>
                <v-card width="928" height="670" elevation="4" class="ma-3"
                        @dragover.prevent="isDragging = true"
                        @dragleave.prevent="isDragging = false"
                        @drop.prevent="onDrop">
                    <v-toolbar density="compact" title="Spectrogram" style="cursor: default;"
                            :color="isDragging ? 'pink-darken-2' : 'grey-darken-3'">
                        <v-dialog v-model="header9809_dialog"  max-width="800">
                            <template v-slot:activator="{ props }">
                                <v-tooltip location="top" text="View &quot;9809&quot; header">
                                    <template v-slot:activator="{ props }">
                                        <v-btn v-bind="props" :disabled="!maxSlider>0" icon="mdi-page-layout-header" @click="header9809_dialog=true"></v-btn>
                                    </template>
                                </v-tooltip>
                                <!-- <v-btn v-bind="props" :disabled="!maxSlider>0" icon="mdi-page-layout-header"></v-btn> -->
                            </template>
                            <v-card>
                                <v-toolbar density="compact" color="grey-darken-2" style="cursor: default;">
                                    <v-btn icon="mdi-page-layout-header" :readonly="true"></v-btn>
                                    <v-toolbar-title text="9809 header"></v-toolbar-title>
                                </v-toolbar>
                                <div class="d-flex justify-center mt-2 mb-2">
                                    <pre style="font-family: 'Roboto Mono'; line-height: normal; white-space: pre; font-size: 12px;">{{ header9809_text }}</pre>
                                </div>
                                <v-card-actions>
                                    <v-spacer></v-spacer>
                                    <v-btn
                                        color="surface-variant" 
                                        text="OK"
                                        variant="flat"
                                        @click="header9809_dialog=false"
                                    ></v-btn>
                                </v-card-actions>
                            </v-card>
                        </v-dialog>
                        <v-tooltip location="top" text="Import &quot;spectrogram&quot; TIF file...">
                            <template v-slot:activator="{ props }">
                                <v-btn v-bind="props" icon="mdi-import" @click="triggerFileInput"></v-btn>
                            </template>
                        </v-tooltip>
                    </v-toolbar>
                    <table border="0" style="width: fit-content; margin-top: 10px; margin-left: 5px;" >
                        <tr>
                            <td style="text-align: center;">
                                <input id="fileInput" ref="fInput" type="file" accept=".tif, .tiff" style="display: none;" @change="onFileChange" />
                                <p>{{ fName }}</p>
                            </td>
                            <td></td>
                            <td></td>
                        </tr>
                        <tr>
                            <td style="position: relative; width: 512px; height: 522px;">
                                <div id="myHeatmap"
                                        style="position: absolute; left: 0px; top: 10px; width: 512px; height: 512px;"
                                ></div>
                                <div id="myCursor"
                                        style="position: absolute; left: 0px; top: 10px; width: 512px; height: 512px;"
                                ></div>
                            </td>
                            <td style="width: 320px; height: 522px;">
                                <div id="myHistgram"
                                        style="width: 320px; height: 522px;"
                                ></div>
                            </td>
                            <td style="width: 32px; height: 522px;" >
                                <!-- なぜかDIVで挟んでおいて倍くらいの高さを指定するとうまく高さが設定できる...? -->
                                <div style="height: 522px;">
                                    <v-range-slider 
                                        v-model = "roi" 
                                        v-if = "maxSlider > 0"
                                        direction = "vertical"
                                        thumb-label="hover"
                                        track-fill-color = "red"
                                        track-color="grey-lighten-1"
                                        v-if = "isROIDisabled == false"
                                        :min = "minROI" 
                                        :max = "maxROI" 
                                        :step = "1" 
                                        :disabled = "isROIDisabled"
                                        style="height: 956px;"
                                        @update:model-value = "onROIChange"
                                    >
                                    </v-range-slider>
                                </div>
                            </td>
                        </tr>
                        <tr>
                            <td style="width: 512px; height: 32px;">
                                <v-slider
                                    v-model = "slider" 
                                    thumb-label="hover"
                                    track-fill-color="transparent" 
                                    track-color="grey-lighten-1"
                                    v-if = "maxSlider > 0"
                                    :min = "minSlider" 
                                    :max = "maxSlider" 
                                    :step = "1" 
                                    @update:model-value = "onInputSlider"
                                    style = "width: 504px; height: 32px;"
                                >
                                <template v-slot:thumb-label="{modelValue}">
                                    {{ getExcitedEnergyFromIdx(modelValue).toFixed(3) }}
                                </template>
                                </v-slider>
                            </td>
                            <td></td>
                            <td></td>
                        </tr>
                    </table>
                </v-card>
                <v-card width="928" height="360" elevation="4" class="ma-3" style="cursor: default;">
                    <v-toolbar density="compact" color="grey-darken-3" title="Post-productive &#x03BCt">
                        <v-tooltip location="top" text="Export to &quot;9809&quot; file...">
                            <template v-slot:activator="{ props }">
                                <v-btn v-bind="props" icon="mdi-export" :disabled="!maxSlider>0" @click="save9809File"></v-btn>
                            </template>
                        </v-tooltip>
                        <!-- <v-btn icon="mdi-export" :disabled="!maxSlider>0" @click="save9809File"></v-btn> -->
                    </v-toolbar>
                    <div id="myMuT"></div>
                </v-card>
            </v-app>
        </div>
    </body>
</html>
